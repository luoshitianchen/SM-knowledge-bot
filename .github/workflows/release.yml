name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests -q
      - name: Build release bundle
        run: |
          mkdir -p release
          cp -r app tests README.md CHANGELOG.md SECURITY_BASELINE.md OPERATIONS.md VERSION requirements.txt requirements.lock release/
          tar -czf $(basename "$GITHUB_REPOSITORY")-$(cat VERSION).tar.gz -C release .
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: '*.tar.gz'
          generate_release_notes: true
