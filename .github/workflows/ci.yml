name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sm_user
          POSTGRES_PASSWORD: sm_password
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check app/ tests/
      - name: Bandit scan
        run: bandit -r app/ -ll
      - name: Pytest with coverage
        env:
          SM_ENV: test
          SM_DATABASE_URL: postgresql+asyncpg://sm_user:sm_password@localhost:5432/test_db
          SM_INTERNAL_API_KEY: ci-test-key
          SM_JWT_SECRET: ci-test-jwt-secret-32chars-min
        run: pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=50
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sm-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
