name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest tests -q
      - run: docker compose config
      - run: python -m pip_audit -r requirements.txt
      - run: python -c "import json,os; assert os.path.exists('sbom.json'); d=json.load(open('sbom.json')); assert d.get('bomFormat')=='CycloneDX' and d['components']; print(f\"SBOM OK: {len(d['components'])} components\")"
