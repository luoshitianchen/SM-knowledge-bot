name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  codeql:
    uses: github/codeql-action/.github/workflows/codeql.yml@v3
    with:
      languages: python
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pip-audit cyclonedx-bom bandit ruff
      - run: pip install -r requirements.txt
      - run: pip-audit -r requirements.txt
      - run: bandit -q -r app -x tests
      - run: ruff check app tests
      - run: cyclonedx-py environment --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-bot-sbom
          path: sbom.cdx.json
