name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    uses: github/codeql-action/.github/workflows/codeql.yml@v4
    with:
      languages: python
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pip-audit cyclonedx-bom
      - run: pip install -r requirements.txt
      - run: pip-audit -r requirements.txt
      - run: cyclonedx-py environment --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-bot-sbom
          path: sbom.cdx.json
