apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sm-knowledge-bot-secret
  namespace: sm-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: sm-knowledge-bot-secret
    creationPolicy: Owner
  data:
    - secretKey: SM_INTERNAL_API_KEY
      remoteRef:
        key: secret/sm/knowledge_bot/internal-api-key
        property: value
    - secretKey: SM_SM4_KEY_HEX
      remoteRef:
        key: secret/sm/knowledge_bot/sm4-key
        property: value
    - secretKey: SM_DATABASE_URL
      remoteRef:
        key: secret/sm/knowledge_bot/database-url
        property: value
