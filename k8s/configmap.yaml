apiVersion: v1
kind: ConfigMap
metadata:
  name: sm-service-config
  namespace: sm-platform
data:
  SM_ENV: "production"
  SM_LOG_LEVEL: "INFO"
  SM_LOG_FORMAT: "json"
  SM_ALLOWED_HOSTS: "sm-service.sm-platform.svc.cluster.local,localhost,127.0.0.1"
  SM_MAX_REQUEST_BYTES: "1048576"
  SM_RATE_WINDOW_SECONDS: "60"
  SM_RATE_MAX_REQUESTS: "600"
  SM_DB_POOL_SIZE: "10"
  SM_DB_MAX_OVERFLOW: "20"
  SM_AUDIT_CENTER_URL: "http://sm-audit-log-center:8300"
