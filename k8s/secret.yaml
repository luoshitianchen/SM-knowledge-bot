# 生产环境应使用 ExternalSecret / Vault，此为模板
apiVersion: v1
kind: Secret
metadata:
  name: sm-service-secrets
  namespace: sm-platform
type: Opaque
stringData:
  SM_INTERNAL_API_KEY: "CHANGE_ME"
  SM_JWT_SECRET: "CHANGE_ME_MIN_32_CHARS"
  SM_SM4_KEY_HEX: "CHANGE_ME_32_HEX"
  SM_DATABASE_URL: "postgresql+asyncpg://sm_user:CHANGE_ME@postgres:5432/sm_service_db"
