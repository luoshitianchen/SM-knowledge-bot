services:
  knowledge-bot:
    build: .
    ports:
      - "${APP_PORT:-8010}:8000"
    environment:
      DATABASE_PATH: /app/data/knowledge_bot.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
