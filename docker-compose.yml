services:
  knowledge-bot:
    build: .
    ports:
      - "${APP_PORT:-8010}:8000"
    environment:
      DATABASE_PATH: /app/data/knowledge_bot.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ERP_AUTH_URL: ${ERP_AUTH_URL:-}
      ERP_INTEGRATION_KEY: ${ERP_INTEGRATION_KEY:-}
      ERP_VERIFY_TLS: ${ERP_VERIFY_TLS:-true}
      KB_ENV: ${KB_ENV:-production}
      KB_SESSION_TTL_SECONDS: ${KB_SESSION_TTL_SECONDS:-28800}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
