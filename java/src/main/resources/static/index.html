<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM Knowledge Bot</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#14213d;font:15px system-ui,"Microsoft YaHei",sans-serif}.page{max-width:1000px;margin:auto;padding:28px 18px}header{padding:30px;background:#175cd3;color:white;border-radius:12px}h1{margin:0 0 8px;font-size:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.card{background:white;border:1px solid #dce3ef;border-radius:10px;padding:18px}.wide{grid-column:1/-1}h2{font-size:18px;margin:0 0 12px}label{display:block;margin-top:10px;font-weight:600}input,textarea{width:100%;margin-top:5px;padding:10px;border:1px solid #b9c5d5;border-radius:6px;font:inherit}textarea{min-height:88px}button{border:0;border-radius:6px;background:#175cd3;color:#fff;padding:10px 14px;margin-top:14px;font-weight:700;cursor:pointer}.result{white-space:pre-wrap;line-height:1.6;background:#eff6ff;padding:12px;border-radius:6px;min-height:58px}.muted{color:#5c6b7e;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head>
<body><main class="page"><header><h1>SM Knowledge Bot</h1><div>GitHub 知识同步、权限检索与多轮问答</div></header><div class="grid"><section class="card"><h2>连接状态</h2><label>当前用户 ID</label><input id="user" value="admin"><button onclick="health()">检查服务</button><p id="status" class="muted">等待检查</p><p id="summary" class="muted"></p></section><section class="card"><h2>同步 GitHub 仓库</h2><label>仓库 URL</label><input id="repository" value="https://github.com/luoshitianchen/SM-knowledge-bot"><label>部门</label><input id="department" value="engineering"><button onclick="sync()">同步知识库</button><p id="sync-result" class="muted"></p></section><section class="card wide"><h2>问答测试</h2><label>问题</label><textarea id="question">如何安装全部 Skill？</textarea><button onclick="chat()">发送问题</button><p class="muted">会话 ID：<span id="conversation">新会话</span></p><div class="result" id="answer">等待提问</div></section></div></main><script>let conversationId=null;const el=id=>document.getElementById(id);const headers=()=>({'Content-Type':'application/json','X-User-Id':el('user').value.trim()});async function call(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?headers():{'X-User-Id':el('user').value.trim()},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.message||data.error||data.detail||'请求失败');return data}async function health(){try{const h=await call('/health');const s=await call('/api/summary');el('status').textContent=`服务正常，${h.version}`;el('summary').textContent=`当前索引：${s.documents} 个文档，${s.chunks} 个知识块`}catch(e){el('status').textContent=e.message}}async function sync(){const output=el('sync-result');output.textContent='正在拉取 GitHub 仓库...';try{const r=await call('/documents/import/github',{repository_url:el('repository').value.trim(),department:el('department').value.trim()});output.textContent=`同步完成：${r.repository}，${r.files} 个文件，${r.chunks} 个知识块`;health()}catch(e){output.textContent=e.message}}async function chat(){const output=el('answer');output.textContent='正在检索...';try{const r=await call('/chat',{question:el('question').value.trim(),conversation_id:conversationId});conversationId=r.conversation_id;el('conversation').textContent=conversationId;output.textContent=r.answer}catch(e){output.textContent=e.message}}health();</script></body></html>
