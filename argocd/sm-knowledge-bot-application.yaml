apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sm-knowledge-bot
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sm-platform
    app.kubernetes.io/environment: prod
spec:
  project: sm-prod
  source:
    repoURL: https://github.com/luoshitianchen/SM-knowledge-bot.git
    targetRevision: main
    path: helm/sm-knowledge-bot
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sm-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
