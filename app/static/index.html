<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SM Knowledge Bot</title>
  <style>
    :root{--ink:#10233d;--blue:#2563eb;--pale:#eff6ff}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font:15px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1050px;margin:auto;padding:34px 20px}header{background:linear-gradient(120deg,#1d4ed8,#0891b2);color:#fff;border-radius:18px;padding:30px}h1{margin:0 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px;box-shadow:0 3px 12px #10233d0c}.wide{grid-column:1/-1}label{display:block;font-weight:700;margin:11px 0 5px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}textarea{min-height:86px;resize:vertical}button{margin-top:13px;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}button:hover{background:#1d4ed8}.hint{color:#64748b;font-size:13px}.answer{white-space:pre-wrap;background:var(--pale);padding:14px;border-radius:8px;min-height:65px}.ok{color:#047857}.error{color:#b91c1c}@media(max-width:720px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
  </style>
</head>
<body><main class="wrap"><header><h1>SM Knowledge Bot</h1><div>GitHub 知识同步 · 权限检索 · 多轮问答</div></header>
<div class="grid">
  <section class="card"><h2>当前用户</h2><p class="hint">本地演示默认使用 admin；生产环境接入企业 SSO/JWT。</p><label>X-User-Id</label><input id="userId" value="admin"><button onclick="checkHealth()">检查服务</button><p id="health" class="hint"></p><p id="summary" class="hint"></p></section>
  <section class="card"><h2>同步 GitHub 仓库</h2><label>仓库 URL</label><input id="repo" value="https://github.com/luoshitianchen/SM-knowledge-bot"><label>部门</label><input id="department" value="engineering"><label>最大文件数</label><input id="maxFiles" type="number" value="30" min="1" max="200"><button onclick="importRepo()">同步并建立索引</button><p id="importResult" class="hint"></p></section>
  <section class="card wide"><h2>网络知识来源</h2><p class="hint">已同步的 GitHub 仓库可在这里查看、再次同步或删除。</p><button onclick="loadSources()">刷新来源列表</button><div id="sourceList" class="answer">尚未加载来源。</div></section>
  <section class="card wide"><h2>知识库问答</h2><label>问题</label><textarea id="question" placeholder="例如：代码评审有什么要求？">代码评审有什么要求？</textarea><button onclick="ask()">发送问题</button><p class="hint">会话 ID：<span id="conversation">新会话</span></p><div id="answer" class="answer">等待提问…</div><div id="sources" class="hint"></div></section>
</div></main>
<script>
let conversationId=null; const $=id=>document.getElementById(id); const headers=()=>({'Content-Type':'application/json','X-User-Id':$('userId').value.trim()});
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?headers():{'X-User-Id':$('userId').value.trim()},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw new Error(data.detail||'请求失败');return data}
async function checkHealth(){try{const d=await api('/health');const s=await api('/api/summary');$('health').className='ok';$('health').textContent=`服务正常，版本 ${d.version}；当前用户：${s.user.name}（${s.user.role}）`;$('summary').textContent=`已索引 ${s.documents} 份文档、${s.chunks} 个知识块、${s.conversations} 个我的会话`}catch(e){$('health').className='error';$('health').textContent=e.message;$('summary').textContent=''}}
async function importRepo(){const out=$('importResult');out.className='hint';out.textContent='正在从 GitHub 拉取…';try{const d=await api('/documents/import/github',{repository_url:$('repo').value.trim(),department:$('department').value.trim(),max_files:Number($('maxFiles').value)});out.className='ok';out.textContent=`同步完成：${d.repository}，${d.files} 个文件、${d.chunks} 个知识块`;loadSources();checkHealth()}catch(e){out.className='error';out.textContent=e.message}}
async function loadSources(){const box=$('sourceList');box.textContent='正在加载…';try{const rows=await api('/sources');if(!rows.length){box.textContent='暂无网络知识来源。';return}box.innerHTML=rows.map(x=>`<div style="padding:10px 0;border-bottom:1px solid #dbe5f1"><strong>${x.repository}</strong><br><span class="hint">分支 ${x.branch} · ${x.department} · ${x.last_file_count} 文件 / ${x.last_chunk_count} 块 · ${x.last_status}</span><br><button onclick="syncSource('${x.id}')">重新同步</button> <button style="background:#b91c1c" onclick="deleteSource('${x.id}')">删除</button></div>`).join('')}catch(e){box.textContent=e.message}}
async function syncSource(id){try{await api(`/sources/${id}/sync`,{max_files:Number($('maxFiles').value)});loadSources();checkHealth()}catch(e){alert(e.message)}}
async function deleteSource(id){if(!confirm('删除来源及其已索引的文档？'))return;try{const r=await fetch(`/sources/${id}`,{method:'DELETE',headers:{'X-User-Id':$('userId').value.trim()}});if(!r.ok)throw Error((await r.json()).detail||'删除失败');loadSources();checkHealth()}catch(e){alert(e.message)}}
async function ask(){const out=$('answer');out.textContent='正在检索…';try{const d=await api('/chat',{question:$('question').value.trim(),conversation_id:conversationId});conversationId=d.conversation_id;$('conversation').textContent=conversationId;out.textContent=d.answer;$('sources').textContent='来源：'+(d.sources.map(x=>x.title).join('；')||'无')}catch(e){out.textContent=e.message;$('sources').textContent=''}} checkHealth();
</script></body></html>
